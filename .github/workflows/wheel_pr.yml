name: Wheel build (PR)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changed:
    name: Check Changed Files
    runs-on: ubuntu-24.04
    outputs:
      any_changed: ${{ steps.check.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Check relevant files
        id: check
        uses: tj-actions/changed-files@v47.0.1
        with:
          files: |
            include/**
            src/**
            cmake/**
            CMakeLists.txt
            python/**
            pyproject.toml
            script/install_sde
            .github/workflows/wheel_pr.yml
            .github/workflows/wheel_merge.yml

  wheel-build:
    name: Python wheel build
    needs: [check-changed]
    if: ${{ needs.check-changed.outputs.any_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "linux"
            arch: "x86_64"
            runs-on: "ubuntu-24.04"
            cibw-os-arch: "manylinux_x86_64"
            cibw-python: "cp314"
            simd: "scalar"
            cpu-arch: ""
          - os: "linux"
            arch: "x86_64"
            runs-on: "ubuntu-24.04"
            cibw-os-arch: "manylinux_x86_64"
            cibw-python: "cp314"
            simd: "avx2"
            cpu-arch: "HSW"
          - os: "linux"
            arch: "x86_64"
            runs-on: "ubuntu-24.04"
            cibw-os-arch: "manylinux_x86_64"
            cibw-python: "cp314"
            simd: "avx512"
            cpu-arch: "SKX"
          - os: "macos"
            arch: "x86_64"
            runs-on: "macos-15-intel"
            cibw-os-arch: "macosx_x86_64"
            cibw-python: "cp314"
            simd: "scalar"
            cpu-arch: ""
          - os: "macos"
            arch: "x86_64"
            runs-on: "macos-15-intel"
            cibw-os-arch: "macosx_x86_64"
            cibw-python: "cp314"
            simd: "avx2"
            cpu-arch: "HSW"
          - os: "macos"
            arch: "arm64"
            runs-on: "macos-15"
            cibw-os-arch: "macosx_arm64"
            cibw-python: "cp314"
            simd: "scalar"
            cpu-arch: ""
    runs-on: ${{ matrix.runs-on }}
    env:
      CMAKE_C_COMPILER: ${{ matrix.runs-on == 'macos-15-intel' && '/usr/local/opt/ccache/libexec/gcc-15' || (matrix.runs-on == 'macos-15' && '/opt/homebrew/opt/ccache/libexec/gcc-15' || '/usr/lib/ccache/gcc') }}
      CMAKE_CXX_COMPILER: ${{ matrix.runs-on == 'macos-15-intel' && '/usr/local/opt/ccache/libexec/g++-15' || (matrix.runs-on == 'macos-15' && '/opt/homebrew/opt/ccache/libexec/g++-15' || '/usr/lib/ccache/g++') }}
      SCALUQ_CPU_NATIVE: "OFF"
      SCALUQ_CPU_ARCH: ${{ matrix.cpu-arch }}
      # Disable Pin analysis inlining for Python stub generation under SDE.
      CIBW_ENVIRONMENT: >-
        SCALUQ_CPU_NATIVE=OFF
        SCALUQ_CPU_ARCH="${{ matrix.cpu-arch }}"
        CMAKE_CROSSCOMPILING_EMULATOR="${{ matrix.simd == 'avx512' && '/tmp/scaluq-sde/sde64;-skx;-p;-inline;-p;0;--' || '' }}"
        SCALUQ_FLOAT32=OFF
        SCALUQ_FLOAT64=ON
      CIBW_BEFORE_ALL_LINUX: ${{ matrix.simd == 'avx512' && 'bash {package}/script/install_sde' || '' }}
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD: ${{ matrix.cibw-python }}-${{ matrix.cibw-os-arch }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos' && '15.0' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          key: "${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.runs-on }}-${{ matrix.simd }}"
          save: false
          verbose: 2

      - name: Install Python dependencies
        run: python -m pip install cibuildwheel twine

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheels

      - name: Check wheel metadata
        run: python -m twine check wheels/*.whl

  wheel-build-passed:
    name: Wheel Build Passed
    needs: [check-changed, wheel-build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
